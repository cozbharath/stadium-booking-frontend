server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router: any unknown path falls back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reasonable caching for built assets
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
